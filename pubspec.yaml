name: xassistant
description: XAssistant - AI Agent unified entry with task management and feedback execution.
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.0

  # Network Communication
  web_socket_channel: ^2.4.0
  dio: ^5.4.0

  # Speech Recognition & TTS
  speech_to_text: 7.2.0
  flutter_tts: ^4.2.0

  # QR Code Scanner
  mobile_scanner: ^4.0.1

  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_animate: ^4.3.0
  flutter_markdown: ^0.6.18
  google_fonts: ^6.1.0

  # URL Launcher
  url_launcher: ^6.2.1

  # Utilities
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  uuid: ^4.2.2
  intl: ^0.20.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  logger: ^2.0.2
  permission_handler: ^11.1.0
  permission_handler_apple: ^9.4.7
  flutter_highlighter: ^0.1.1

  # Notifications
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  go_router_builder: ^2.4.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
